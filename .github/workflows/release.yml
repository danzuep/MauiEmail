name: Release
run-name: MauiEmail ${{ inputs.mode || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version; leave blank to use 1.0.<run number>'
        required: false
        type: string
      mode:
        description: 'Release publishes assets; pipeline-test publishes workflow artifacts; build-only just compiles'
        required: true
        type: choice
        options:
          - release
          - pipeline-test
          - build-only
        default: release
      publish_unsigned_android:
        description: 'Include an unsigned Android APK in the GitHub Release when signing secrets are missing. Unsigned APKs cannot be installed until signed.'
        required: true
        type: boolean
        default: false
  push:
    branches:
      - release
      - build
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      mode: ${{ steps.version.outputs.mode }}
      android_signing_configured: ${{ steps.version.outputs.android_signing_configured }}
      android_artifact_available: ${{ steps.version.outputs.android_artifact_available }}
      android_artifact_suffix: ${{ steps.version.outputs.android_artifact_suffix }}
    steps:
      - name: Validate and set version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PUBLISH_UNSIGNED_ANDROID: ${{ inputs.publish_unsigned_android }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            version="1.0.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" || ( "$EVENT_NAME" == "push" && "$REF_NAME" != "release" ) ]]; then
            mode=build-only
          elif [[ -n "$INPUT_MODE" ]]; then
            mode="$INPUT_MODE"
          else
            mode=release
          fi

          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            android_signing_configured=true
          else
            android_signing_configured=false
          fi

          if [[ "$mode" == "pipeline-test" || "$android_signing_configured" == "true" || "$INPUT_PUBLISH_UNSIGNED_ANDROID" == "true" ]]; then
            android_artifact_available=true
          else
            android_artifact_available=false
          fi

          if [[ "$mode" == "release" && "$android_signing_configured" == "true" ]]; then
            android_artifact_suffix=signed
          else
            android_artifact_suffix=unsigned
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "android_signing_configured=$android_signing_configured" >> "$GITHUB_OUTPUT"
          echo "android_artifact_available=$android_artifact_available" >> "$GITHUB_OUTPUT"
          echo "android_artifact_suffix=$android_artifact_suffix" >> "$GITHUB_OUTPUT"
          echo "### MauiEmail workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: $mode" >> "$GITHUB_STEP_SUMMARY"
          echo "Android signing configured: $android_signing_configured" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.platform }} app
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            workload: maui
            target_framework: net10.0-windows10.0.19041.0
          - platform: android
            runner: ubuntu-latest
            workload: maui-android
            target_framework: net10.0-android
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set writable .NET installation directory
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Get .NET SDK version
        id: sdk
        shell: bash
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet-${{ steps.sdk.outputs.version }}-nuget-${{ hashFiles('src/OutlookClone/OutlookClone.csproj') }}
          restore-keys: ${{ runner.os }}-dotnet-${{ steps.sdk.outputs.version }}-nuget-

      - name: Cache .NET workload packs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && 'C:\Program Files\dotnet\packs' || '~/.dotnet/packs' }}
            ${{ runner.os == 'Windows' && 'C:\Program Files\dotnet\sdk-manifests' || '~/.dotnet/sdk-manifests' }}
            ${{ runner.os == 'Windows' && 'C:\Program Files\dotnet\metadata\workloads' || '~/.dotnet/metadata/workloads' }}
          key: ${{ runner.os }}-dotnet-${{ steps.sdk.outputs.version }}-${{ matrix.workload }}-workloads

      - name: Install .NET MAUI workload
        run: dotnet workload install ${{ matrix.workload }}

      - name: Build Windows app
        if: ${{ matrix.platform == 'windows' && (github.event_name == 'pull_request' || needs.version.outputs.mode == 'build-only') }}
        run: dotnet build src/OutlookClone/OutlookClone.csproj -c Release -f ${{ matrix.target_framework }} --nologo

      - name: Publish Windows app
        if: ${{ matrix.platform == 'windows' && github.event_name != 'pull_request' && needs.version.outputs.mode != 'build-only' }}
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          dotnet publish src/OutlookClone/OutlookClone.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:Version=$env:VERSION
          -p:ApplicationDisplayVersion=$env:VERSION
          -o publish

      - name: Create Windows release archive
        if: ${{ matrix.platform == 'windows' && github.event_name != 'pull_request' && needs.version.outputs.mode != 'build-only' }}
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: Compress-Archive -Path publish/* -DestinationPath "MauiEmail-$env:VERSION-win-x64.zip"

      - name: Upload Windows artifact
        if: ${{ matrix.platform == 'windows' && github.event_name != 'pull_request' && needs.version.outputs.mode != 'build-only' }}
        uses: actions/upload-artifact@v7
        with:
          name: MauiEmail-windows
          path: MauiEmail-${{ needs.version.outputs.version }}-win-x64.zip
          if-no-files-found: error

      - name: Build Android app
        if: ${{ matrix.platform == 'android' && (github.event_name == 'pull_request' || needs.version.outputs.mode == 'build-only') }}
        run: dotnet build src/OutlookClone/OutlookClone.csproj -c Release -f ${{ matrix.target_framework }} --nologo

      - name: Publish Android APK
        if: ${{ matrix.platform == 'android' && github.event_name != 'pull_request' && needs.version.outputs.mode != 'build-only' && needs.version.outputs.android_artifact_available == 'true' }}
        shell: bash
        env:
          MODE: ${{ needs.version.outputs.mode }}
          VERSION: ${{ needs.version.outputs.version }}
          ANDROID_SIGNING_CONFIGURED: ${{ needs.version.outputs.android_signing_configured }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          common_args=(
            src/OutlookClone/OutlookClone.csproj
            -c Release
            -f net10.0-android
            "-p:Version=$VERSION"
            "-p:ApplicationDisplayVersion=$VERSION"
            "-p:ApplicationVersion=$GITHUB_RUN_NUMBER"
            -o publish
          )

          if [[ "$MODE" == "release" ]]; then
            if [[ "$ANDROID_SIGNING_CONFIGURED" == "true" ]]; then
              keystore_path="$RUNNER_TEMP/mauemail-release.keystore"
              printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
              dotnet publish "${common_args[@]}" \
                -p:AndroidKeyStore=true \
                "-p:AndroidSigningKeyStore=$keystore_path" \
                "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" \
                "-p:AndroidSigningStorePass=$ANDROID_KEYSTORE_PASSWORD" \
                "-p:AndroidSigningKeyPass=$ANDROID_KEY_PASSWORD"
            else
              echo '::warning::Publishing an unsigned Android APK because signing secrets are missing.'
              dotnet publish "${common_args[@]}" -p:AndroidKeyStore=false
            fi
          else
            echo '::warning::Pipeline-test APK is unsigned.'
            dotnet publish "${common_args[@]}" -p:AndroidKeyStore=false
          fi

          apk_file=$(find publish -maxdepth 1 -type f -name '*.apk' -print -quit)
          if [[ -z "$apk_file" ]]; then
            echo 'No APK was produced.' >&2
            exit 1
          fi
          cp "$apk_file" "MauiEmail-$VERSION-android-${{ needs.version.outputs.android_artifact_suffix }}.apk"

      - name: Upload Android artifact
        if: ${{ matrix.platform == 'android' && github.event_name != 'pull_request' && needs.version.outputs.mode != 'build-only' && needs.version.outputs.android_artifact_available == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: MauiEmail-android
          path: MauiEmail-${{ needs.version.outputs.version }}-android-${{ needs.version.outputs.android_artifact_suffix }}.apk
          if-no-files-found: error

  publish_release:
    name: Create tag and GitHub Release
    if: ${{ github.event_name != 'pull_request' && needs.version.outputs.mode == 'release' }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: MauiEmail-windows
          path: release-assets

      - name: Download Android artifact
        if: ${{ needs.version.outputs.android_artifact_available == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: MauiEmail-android
          path: release-assets

      - name: Generate commit history and create annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          tag="v$VERSION"
          if git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          previous_tag=$(git describe --tags --abbrev=0 "$TARGET_SHA" 2>/dev/null || true)
          printf '# MauiEmail %s\n\nVersion: %s\n\n## Changes\n\n' "$tag" "$VERSION" > release-notes.md
          if [[ -n "$previous_tag" ]]; then
            git log "$previous_tag..$TARGET_SHA" --pretty=format:'- %h %s%n' >> release-notes.md
          else
            git log "$TARGET_SHA" --pretty=format:'- %h %s%n' >> release-notes.md
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$tag" "$TARGET_SHA" --file release-notes.md
          git push origin "$tag"

          gh release create "$tag" release-assets/* \
            --title "MauiEmail $tag" \
            --notes-file release-notes.md \
            --verify-tag