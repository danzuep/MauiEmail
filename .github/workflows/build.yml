name: Build
run-name: Build MauiEmail targets

on:
  workflow_dispatch:
  push:
    branches:
      - build
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            workload: maui
            target_framework: net10.0-windows10.0.19041.0
          - platform: android
            runner: ubuntu-latest
            workload: maui-android
            target_framework: net10.0-android
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Get .NET SDK version
        id: sdk
        shell: bash
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet-${{ steps.sdk.outputs.version }}-nuget-${{ hashFiles('src/OutlookClone/OutlookClone.csproj') }}
          restore-keys: ${{ runner.os }}-dotnet-${{ steps.sdk.outputs.version }}-nuget-

      - name: Cache .NET workload packs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && 'C:\Program Files\dotnet\packs' || '/usr/share/dotnet/packs' }}
            ${{ runner.os == 'Windows' && 'C:\Program Files\dotnet\metadata\workloads' || '/usr/share/dotnet/metadata/workloads' }}
          key: ${{ runner.os }}-dotnet-${{ steps.sdk.outputs.version }}-${{ matrix.workload }}-workloads

      - name: Install .NET MAUI workload
        run: dotnet workload install ${{ matrix.workload }}

      - name: Build app
        run: dotnet build src/OutlookClone/OutlookClone.csproj -c Release -f ${{ matrix.target_framework }} --nologo
